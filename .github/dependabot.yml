version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: daily
    groups:
      build-tools:
        patterns: ['com.android.*', 'org.jetbrains.kotlin:*']
      bouncy-castle:
        patterns: ['org.bouncycastle:*']
      test-libraries:
        patterns: ['junit:*', 'org.robolectric:*']
      app-libraries:
        patterns: ['*']
        exclude-patterns: ['gradle-wrapper']
