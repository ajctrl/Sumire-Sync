name: Android build

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify APK
    uses: ./.github/workflows/verify-apk.yml
    with:
      ref: ${{ github.sha }}

  dependency-audit:
    name: Resolve all dependency configurations
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      # Resolve build, lint, device-test and app dependencies on every branch.
      # Upload for review; only the main workflow submits the dependency graph.
      - uses: gradle/actions/dependency-submission@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          dependency-graph: generate-and-upload

  build:
    needs: verify
    if: always()
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Require successful APK verification
        if: needs.verify.result != 'success'
        run: exit 1

      - name: Check out source
        uses: actions/checkout@v7

      - name: Test release automation
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: |
          ./gradlew --no-daemon assembleDebug
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/Sumire-Sync-debug-${GITHUB_SHA}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-${{ github.sha }}
          path: artifacts/*
          if-no-files-found: error
