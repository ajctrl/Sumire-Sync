name: Verify release APK
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: true
    outputs:
      unsigned_digest:
        value: ${{ jobs.compare.outputs.digest }}
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        copy: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Validate Gradle Wrapper JAR
        uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - run: python3 .github/scripts/verify_gradle_distribution.py
      - if: matrix.copy == 1
        run: ./gradlew --no-daemon -PverifyUnsignedRelease=true testDebugUnitTest lintRelease
      - run: ./gradlew --no-daemon -PverifyUnsignedRelease=true assembleRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-${{ matrix.copy }}
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  compare:
    name: Compare APKs
    needs: build
    outputs:
      digest: ${{ steps.compare.outputs.digest }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: unsigned-*
          path: builds
      - id: compare
        run: |
          cmp builds/unsigned-1/app-release-unsigned.apk builds/unsigned-2/app-release-unsigned.apk
          digest=$(sha256sum builds/unsigned-1/app-release-unsigned.apk)
          echo "digest=${digest%% *}" >> "$GITHUB_OUTPUT"
