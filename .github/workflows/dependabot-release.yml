name: Dependabot dependency release

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependabot-patch-release
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    if: github.repository == 'ajctrl/Sumire-Sync' && github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # Read draft releases and push the release tag.
      pull-requests: read
    outputs:
      commit: ${{ steps.plan.outputs.commit }}
      prs: ${{ steps.plan.outputs.prs }}
      code: ${{ steps.plan.outputs.code }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0  # Compare main with the complete histories of published tags.
          persist-credentials: false
      - name: Calculate candidate Android versions
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/dependabot_release.py plan

      - name: Reserve the release tag
        if: steps.plan.outputs.commit != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' push origin "HEAD:refs/tags/v$VERSION"

  verify:
    needs: plan
    if: needs.plan.outputs.commit != '' && github.run_attempt == '1'
    uses: ./.github/workflows/verify-apk.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}

  publish:
    needs: [plan, verify]
    if: needs.plan.outputs.commit != '' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.plan.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: unsigned-1
          path: verified
      - name: Check the APK selected by the comparison job
        env:
          EXPECTED_DIGEST: ${{ needs.verify.outputs.unsigned_digest }}
        run: printf '%s  %s\n' "$EXPECTED_DIGEST" verified/app-release-unsigned.apk | sha256sum --check --strict
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        shell: bash
        run: |
          bash .github/scripts/sign_apk.sh verified/app-release-unsigned.apk "artifacts/Sumire-Sync-v${RELEASE_VERSION}.apk"
      - name: Check the signed APK versions and Git revision
        env:
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_CODE: ${{ needs.plan.outputs.code }}
        run: python3 .github/scripts/dependabot_release.py verify-apk-version
      - name: Publish the signed APK
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ needs.plan.outputs.commit }}
          RELEASE_PRS: ${{ needs.plan.outputs.prs }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
        run: python3 .github/scripts/dependabot_release.py publish

  dependencies:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/dependency-submission.yml

  notify-failure:
    needs: [plan, verify, publish]
    if: >-
      failure() && needs.plan.outputs.prs != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - run: python3 .github/scripts/dependabot_release.py release-notice
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRS: ${{ needs.plan.outputs.prs }}
